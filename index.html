<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an Appointment</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #d2d2d7; --accent: #0a66d8; --accent-text: #fff; --danger: #c9302c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: #3a3a3c; --accent: #3b8ef5; --danger: #ff6961; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 30px; margin: 8px 0 4px; }
  h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 28px 4px 8px; }
  p.note { color: var(--muted); font-size: 14px; margin: 0 4px; }
  .card { background: var(--card); border-radius: 16px; padding: 4px 16px; }
  .option { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
    padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit;
    font: inherit; text-align: left; cursor: pointer; }
  .option:last-child { border-bottom: 0; }
  .option small { display: block; color: var(--muted); font-size: 14px; }
  .option .check { color: var(--accent); font-weight: 700; visibility: hidden; }
  .option[aria-pressed="true"] .check { visibility: visible; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .chip { flex: none; min-width: 64px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: inherit; font: inherit; font-size: 15px; text-align: center; cursor: pointer; }
  .chip small { display: block; color: var(--muted); font-size: 12px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .chip[aria-pressed="true"] small { color: inherit; }
  .chip:disabled { opacity: .35; cursor: default; }
  label { display: block; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  label:last-child { border-bottom: 0; }
  input, textarea { display: block; width: 100%; margin-top: 2px; padding: 4px 0; border: 0; background: none;
    color: var(--text); font: inherit; font-size: 17px; outline: none; resize: vertical; }
  .primary { display: block; width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .4; cursor: default; }
  .primary.danger { background: none; border: 1px solid var(--danger); color: var(--danger); }
  .error { color: var(--danger); margin: 12px 4px 0; font-size: 15px; }
  .summary { padding: 16px; }
  .summary strong { display: block; font-size: 20px; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Book an Appointment</h1>
  <p class="note" id="intro">Loading…</p>

  <section id="booking" hidden>
    <h2>1. Choose a service</h2>
    <div class="card" id="services"></div>

    <div id="step-date" hidden>
      <h2>2. Choose a date</h2>
      <div class="chips" id="dates"></div>
    </div>

    <div id="step-time" hidden>
      <h2>3. Choose a time</h2>
      <div class="grid" id="slots"></div>
      <p class="note" id="no-slots" hidden>No times are available on this day. Please pick another date.</p>
    </div>

    <form id="step-form" hidden>
      <h2>4. Your details</h2>
      <div class="card">
        <label>Name<input name="name" required maxlength="80" autocomplete="name"></label>
        <label>Phone<input name="phone" required minlength="5" maxlength="30" type="tel" autocomplete="tel"></label>
        <label>Email (optional)<input name="email" maxlength="120" type="email" autocomplete="email"></label>
        <label>Notes (optional)<textarea name="notes" rows="2" maxlength="500" placeholder="Anything we should know beforehand?"></textarea></label>
      </div>
      <p class="error" id="error" hidden></p>
      <button class="primary" id="submit">Request Appointment</button>
      <p class="note" style="margin-top:12px">Your appointment is not final until we confirm it.</p>
    </form>
  </section>

  <section id="result" hidden>
    <h2 id="result-title"></h2>
    <div class="card summary">
      <strong id="result-when"></strong>
      <span id="result-what"></span>
    </div>
    <p class="note" id="result-note" style="margin-top:12px"></p>
    <button class="primary danger" id="cancel" hidden>Cancel This Appointment</button>
    <p style="margin:20px 4px 0"><a id="result-link" href="."></a></p>
  </section>
</main>

<script>
// ---- Settings ----
const SUPABASE_URL = 'https://mkgtxmophaneywaxiqvy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_gO8KCuxY_QHq41jBs51ZTA_GGw-2n5g';
const TIME_ZONE = 'America/Los_Angeles';   // time zone the business hours are in
// weekday (0 = Sunday) -> [open, close] hour; days not listed are closed.
const HOURS = { 1: [13, 20], 2: [13, 20], 3: [13, 20], 4: [13, 20], 5: [13, 20], 6: [8, 14] };
const DAYS_AHEAD = 14;     // how many days ahead can be booked
const STEP_MINUTES = 30;   // minutes between start times
const LEAD_MINUTES = 120;  // minimum notice for a booking, in minutes
const CANCEL_HOURS = 24;   // confirmed bookings can be cancelled up to this many hours before (must match cancel_request in the database)

// ---- Helpers ----
const $ = id => document.getElementById(id);
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

async function api(path, options = {}) {
  const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', ...options.headers },
  });
  if (!response.ok) throw new Error(await response.text());
  return response.status === 204 || options.headers?.Prefer === 'return=minimal' ? null : response.json();
}
const rpc = (name, body) => api(`rpc/${name}`, { method: 'POST', body: JSON.stringify(body) });

// Wall-clock time in the business time zone -> instant in ms, handling daylight saving.
function zoneOffset(ms) {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
    timeZone: TIME_ZONE, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  }).formatToParts(new Date(ms)).map(p => [p.type, p.value]));
  return Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second) - Math.floor(ms / 1000) * 1000;
}
function wallTime(year, month, day, minutes) {
  const guess = Date.UTC(year, month - 1, day, 0, minutes);
  return guess - zoneOffset(guess - zoneOffset(guess));
}
const formatDate = ms => new Date(ms).toLocaleDateString('en-US', { timeZone: TIME_ZONE, month: 'long', day: 'numeric', weekday: 'long' });
const formatTime = ms => new Date(ms).toLocaleTimeString('en-US', { timeZone: TIME_ZONE, hour: 'numeric', minute: '2-digit' });
const zoneName = () => new Intl.DateTimeFormat('en-US', { timeZone: TIME_ZONE, timeZoneName: 'short' })
  .formatToParts(new Date()).find(p => p.type === 'timeZoneName').value;

function button(className, pressed, onClick) {
  const element = document.createElement('button');
  element.type = 'button';
  element.className = className;
  element.setAttribute('aria-pressed', pressed);
  element.addEventListener('click', onClick);
  return element;
}
function text(tag, value) {
  const element = document.createElement(tag);
  element.textContent = value;
  return element;
}

// ---- Booking flow ----
const state = { services: [], busy: [], service: null, day: null, start: null };

function days() {
  const [y, m, d] = new Intl.DateTimeFormat('en-CA', { timeZone: TIME_ZONE }).format(new Date()).split('-').map(Number);
  return Array.from({ length: DAYS_AHEAD }, (_, i) => {
    const date = new Date(Date.UTC(y, m - 1, d + i));
    return { year: date.getUTCFullYear(), month: date.getUTCMonth() + 1, day: date.getUTCDate(), weekday: date.getUTCDay() };
  });
}

function slotsFor(day) {
  const hours = HOURS[day.weekday];
  if (!hours || !state.service) return [];
  const length = state.service.duration_minutes;
  const earliest = Date.now() + LEAD_MINUTES * 60000;
  const slots = [];
  for (let minutes = hours[0] * 60; minutes + length <= hours[1] * 60; minutes += STEP_MINUTES) {
    const start = wallTime(day.year, day.month, day.day, minutes);
    const end = start + length * 60000;
    if (start >= earliest && !state.busy.some(b => b.start < end && b.end > start)) slots.push(start);
  }
  return slots;
}

function render() {
  const services = $('services');
  services.replaceChildren(...state.services.map(service => {
    const option = button('option', state.service === service, () => {
      state.service = service; state.start = null; render();
    });
    const label = document.createElement('span');
    const price = service.price > 0 ? ` · $${service.price}` : '';
    label.append(service.name, text('small', `${service.duration_minutes} min${price}`));
    option.append(label, text('span', '✓'));
    option.lastChild.className = 'check';
    return option;
  }));

  $('step-date').hidden = !state.service;
  $('dates').replaceChildren(...days().map(day => {
    const selected = state.day && state.day.day === day.day && state.day.month === day.month;
    const chip = button('chip', !!selected, () => { state.day = day; state.start = null; render(); });
    chip.disabled = slotsFor(day).length === 0;
    chip.append(text('small', WEEKDAYS[day.weekday]), `${day.month}/${day.day}`);
    return chip;
  }));

  const slots = state.day ? slotsFor(state.day) : [];
  $('step-time').hidden = !state.service || !state.day;
  $('no-slots').hidden = slots.length > 0;
  $('slots').replaceChildren(...slots.map(start => {
    const chip = button('chip', state.start === start, () => {
      state.start = start; render();
      $('step-form').scrollIntoView({ block: 'start' });
    });
    chip.textContent = formatTime(start);
    return chip;
  }));

  $('step-form').hidden = !state.start;
}

function showResult(title, row, note, link) {
  $('booking').hidden = true;
  $('intro').hidden = true;
  $('result').hidden = false;
  $('result-title').textContent = title;
  $('result-when').textContent = row ? `${formatDate(row.start)} ${formatTime(row.start)}–${formatTime(row.end)}` : '';
  $('result-what').textContent = row ? row.service : '';
  $('result-note').textContent = note;
  $('result-link').textContent = link.label;
  $('result-link').href = link.href;
}

$('step-form').addEventListener('submit', async event => {
  event.preventDefault();
  const form = new FormData(event.target);
  const id = crypto.randomUUID();
  const end = state.start + state.service.duration_minutes * 60000;
  $('submit').disabled = true;
  $('error').hidden = true;
  try {
    await api('booking_requests', {
      method: 'POST',
      headers: { Prefer: 'return=minimal' },
      body: JSON.stringify({
        id,
        name: form.get('name').trim(), phone: form.get('phone').trim(),
        email: form.get('email').trim(), notes: form.get('notes').trim(),
        service_id: state.service.id, service_name: state.service.name,
        start_at: new Date(state.start).toISOString(), end_at: new Date(end).toISOString(),
      }),
    });
    try { history.replaceState(null, '', `?r=${id}`); } catch {}
    // Remembered on the customer's own device to prefill next time.
    try {
      localStorage.setItem('contact', JSON.stringify({
        name: form.get('name').trim(), phone: form.get('phone').trim(), email: form.get('email').trim(),
      }));
    } catch {}
    showResult('Request sent – awaiting confirmation', { start: state.start, end, service: state.service.name },
      'We will let you know once it is confirmed. Save this page\'s link to check the status or cancel later.', { label: 'Check status or cancel', href: `?r=${id}` });
  } catch (error) {
    $('error').textContent = 'Something went wrong. Please try again.';
    $('error').hidden = false;
    $('submit').disabled = false;
  }
});

async function showStatus(id) {
  const rows = await rpc('get_request_status', { request_id: id });
  const again = { label: 'Book another time', href: '.' };
  if (!rows.length) return showResult('Appointment not found', null, 'This link may no longer be valid.', again);
  const row = { start: Date.parse(rows[0].start_at), end: Date.parse(rows[0].end_at), service: rows[0].service_name };
  const status = {
    pending: ['Awaiting confirmation', 'We will let you know once it is confirmed. You can also check back on this page.'],
    accepted: ['Appointment confirmed', 'See you then!'],
    declined: ['This time is not available', 'Sorry about that. Please choose another time.'],
    cancelled: ['Appointment cancelled', 'This appointment has been cancelled.'],
  }[rows[0].status];
  const isPending = rows[0].status === 'pending';
  const canCancel = isPending || (rows[0].status === 'accepted' && row.start - Date.now() > CANCEL_HOURS * 3600000);
  const tooLate = rows[0].status === 'accepted' && !canCancel && row.start > Date.now();
  showResult(status[0], row, status[1] + (tooLate ? ` It is less than ${CANCEL_HOURS} hours away, so please contact us directly if you need to cancel.` : ''), again);
  $('cancel').hidden = !canCancel;
  $('cancel').onclick = async () => {
    if (!confirm('Cancel this appointment?')) return;
    $('cancel').disabled = true;
    try { await rpc('cancel_request', { request_id: id }); } catch {}
    $('cancel').disabled = false;
    showStatus(id);
  };
}

async function start() {
  const requestId = new URLSearchParams(location.search).get('r');
  if (requestId) return showStatus(requestId);

  const now = new Date();
  const [services, busy] = await Promise.all([
    api('services?select=id,name,duration_minutes,price&order=name'),
    rpc('get_busy', { range_start: now.toISOString(), range_end: new Date(now.getTime() + (DAYS_AHEAD + 1) * 86400000).toISOString() }),
  ]);
  state.services = services;
  state.busy = busy.map(b => ({ start: Date.parse(b.start_at), end: Date.parse(b.end_at) }));
  if (!services.length) {
    $('intro').textContent = 'Online booking is not open yet.';
    return;
  }
  $('intro').textContent = `All times are shown in ${zoneName()}.`;
  $('booking').hidden = false;
  try {
    const saved = JSON.parse(localStorage.getItem('contact')) || {};
    for (const field of ['name', 'phone', 'email']) $('step-form').elements[field].value = saved[field] || '';
  } catch {}
  render();
}

start().catch(() => { $('intro').textContent = 'Could not load. Please refresh the page.'; });
</script>
</body>
</html>
